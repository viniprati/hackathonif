name: nativa
description: Protótipo de distribuição de alimentos para escolas.
publish_to: none
version: 1.3.0+12

environment:
  sdk: ^3.12.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  package_info_plus: ^10.2.2
  pdf: ^3.13.1
  printing: ^5.15.1
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/nativa_launcher.png
  adaptive_icon_background: '#F7F3E8'
  adaptive_icon_foreground: assets/images/nativa_logo.png
  remove_alpha_ios: true
  background_color_ios: '#F7F3E8'
  web:
    generate: true
    image_path: assets/images/nativa_launcher.png
    background_color: '#F7F3E8'
    theme_color: '#2F593D'

flutter:
  uses-material-design: true
  assets:
    - assets/images/nativa_logo.png
    - assets/fonts/
